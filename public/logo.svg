<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="TrendFinder">
  <defs>
    <linearGradient id="tf-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#0b1020"/>

  <!-- discovery ring + magnifier handle -->
  <g transform="translate(256 190)">
    <circle cx="0" cy="0" r="86" fill="none" stroke="url(#tf-g)" stroke-width="26"/>
    <rect x="52" y="52" width="30" height="96" rx="15" transform="rotate(-45 67 100)" fill="url(#tf-g)"/>

    <!-- ascending bars -->
    <g fill="#f8fafc">
      <rect x="-46" y="-2" width="22" height="46" rx="4"/>
      <rect x="-14" y="-22" width="22" height="66" rx="4"/>
      <rect x="18" y="-44" width="22" height="88" rx="4"/>
    </g>

    <!-- rising arrow -->
    <path d="M-70 40 C -20 40 20 -20 70 -58" fill="none" stroke="url(#tf-g)" stroke-width="20" stroke-linecap="round"/>
    <path d="M44 -58 L74 -62 L66 -32 Z" fill="url(#tf-g)"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="360" text-anchor="middle" font-family="Rubik, Arial, sans-serif" font-weight="800" font-size="70" letter-spacing="1">
    <tspan fill="#f8fafc">Trend</tspan><tspan fill="url(#tf-g)">Finder</tspan>
  </text>
  <text x="256" y="404" text-anchor="middle" font-family="Rubik, Arial, sans-serif" font-weight="500" font-size="26" letter-spacing="3" fill="#7c88a8">
    FIND THE NEXT TREND
  </text>
</svg>
